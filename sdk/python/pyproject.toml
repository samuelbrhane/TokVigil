[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenfence"
version = "0.1.0"
description = "Python SDK for TokenFence - AI usage control platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "TokenFence", email = "support@tokenfence.io"}
]
keywords = ["ai", "llm", "rate-limiting", "usage-control", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0",
]


[project.urls]
Homepage = "https://tokenfence.io"
Documentation = "https://tokenfence.io/docs/sdk/python"